<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İçerik Sayfası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .icerik-kutusu {
            width: 100%;
            max-width: 700px;
            padding: 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 16px;
            color: #38bdf8;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 24px;
        }
        .duyuru-karti {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="icerik-kutusu">
        <h1>Sisteme Hoş Geldin!</h1>
        <p>Bu içerik doğrudan GitHub üzerindeki icerik.html dosyasından canlı olarak çekildi. Buradaki yazıyı her değiştirdiğinde ana sitendeki görünüm de otomatik olarak güncellenecektir.</p>
        <div class="duyuru-karti">Son Güncelleme: 13 Kasım 2026</div>
    </div>
</body>
</html>
